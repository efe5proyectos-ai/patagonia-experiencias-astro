<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- ===========================================================================
     REDIRECCIÓN A LA APP · Patagonia Experiencias
     ---------------------------------------------------------------------------
     Manda a quien entre por la raíz del dominio directo a patagonia-experiencias.html

     PRESERVA hash y query string. Es lo importante: el sitio usa rutas por hash
     (#tour/slug, #prestador/slug, #nota/slug) y parámetros (?q=, códigos promo).
     Si alguien comparte patagoniaexperiencias.com/#tour/valle-inferior o un link
     con código de descuento, tiene que llegar al lugar correcto y no a la home.

     Tres capas, por orden de rapidez:
       1. JavaScript  → instantáneo y arrastra hash + query
       2. meta refresh → si el navegador tiene JS desactivado
       3. link visible → si todo lo demás falla, el visitante puede tocar

     El canonical le dice a Google cuál es la página real, así no se parte el SEO
     entre la raíz y el archivo.

     OJO CON ASTRO: si el proyecto tiene un src/pages/index.astro, ESE le gana a
     este archivo y el build lo ignora. En ese caso hay que borrar o renombrar
     el index.astro, o usar el _redirects que ya existe en public/.

     Las rutas van RELATIVAS (sin barra inicial) a propósito: así funciona tanto
     si el sitio está en la raíz del dominio como si cuelga de un subdirectorio.
     =========================================================================== -->

<title>Patagonia Experiencias | Reservá tu próxima aventura</title>
<meta name="description" content="La plataforma de reservas turísticas de la Patagonia: excursiones, alojamientos, gastronomía y experiencias con prestadores habilitados.">
<link rel="canonical" href="https://patagoniaexperiencias.com/patagonia-experiencias.html">

<!-- Capa 2: si no hay JS, redirige igual (sin conservar el hash) -->
<meta http-equiv="refresh" content="0; url=patagonia-experiencias.html">

<!-- Capa 1: instantánea y conservando todo. Va antes del render para que ni se vea. -->
<script>
  (function () {
    var destino = 'patagonia-experiencias.html';
    // location.search = "?q=ballenas"   ·   location.hash = "#tour/valle-inferior"
    var extra = (window.location.search || '') + (window.location.hash || '');
    // replace() en vez de href: no deja la raíz en el historial, así el botón
    // "atrás" del navegador lleva a donde el visitante venía y no a un rebote.
    window.location.replace(destino + extra);
  })();
</script>

<style>
  html, body { margin: 0; height: 100%; }
  body {
    font-family: 'Inter', -apple-system, 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(135deg, #1f2937 0%, #2c3e50 45%, #C2185B 100%);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 24px;
  }
  .marca { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; margin: 0 0 6px; }
  .marca span { color: #F8BBD0; }
  .eyebrow {
    font-size: 10px; letter-spacing: 4px; text-transform: uppercase;
    font-weight: 700; color: rgba(255,255,255,.6); margin: 0 0 26px;
  }
  .cargando { font-size: 13px; color: rgba(255,255,255,.75); margin: 0 0 20px; }
  .link {
    display: inline-block; background: #E91E63; color: #fff;
    padding: 13px 30px; border-radius: 50px; text-decoration: none;
    font-weight: 700; font-size: 12px; letter-spacing: 2px; text-transform: uppercase;
  }
  .spinner {
    width: 26px; height: 26px; margin: 0 auto 20px;
    border: 3px solid rgba(255,255,255,.25); border-top-color: #F8BBD0;
    border-radius: 50%; animation: girar .8s linear infinite;
  }
  @keyframes girar { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
</style>
</head>
<body>
  <!-- Capa 3: solo se llega a ver si fallaron las dos anteriores -->
  <main>
    <div class="spinner"></div>
    <p class="marca">Patagonia<span>Experiencias</span></p>
    <p class="eyebrow">Plataforma de Reservas</p>
    <p class="cargando">Llevándote a las experiencias…</p>
    <a class="link" href="patagonia-experiencias.html">Entrar ahora</a>
  </main>
</body>
</html>
